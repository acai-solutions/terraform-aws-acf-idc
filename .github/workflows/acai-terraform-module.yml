name: ACAI TERRAFORM MODULE

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  tf_module_checks:
    uses: acai-solutions/github-workflows/.github/workflows/checks-py-hcl-module.yml@main
    if: ${{ github.event_name == 'pull_request' }}
    with:
      # Terratest lives in test/, not the tests/ default of the check workflows.
      hcl_terratest_path: "test/terratest"
    secrets: inherit

    
  tf_module_release:
    uses: acai-solutions/github-workflows/.github/workflows/hcl-module-release.yml@main
    if: ${{ github.event_name == 'push' }}
    secrets: inherit
